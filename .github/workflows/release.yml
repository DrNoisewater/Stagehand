# Makes a release by hand: Actions → Release → Run workflow → enter the version.
# 4.0.1: one download per release, Stagehand-Setup-<version>.exe (a few MB): it installs
# or updates Stagehand and downloads only what the PC doesn't have yet.
#   1. (Windows) checks the version, runs the tests, builds the sound engine.
#   2. (Linux) builds Setup around that engine with the same scripts as a cloud session
#      (scripts/session-setup.sh, scripts/package.sh), then tags v<version> and publishes
#      the release with Setup and short notes. Nothing is tagged unless Setup built.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 3.9.0). Must match "version" in package.json.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Stagehand
  VERSION: ${{ inputs.version }}
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  LLVM_MINGW_VERSION: '20251104' # same compiler scripts/session-setup.sh uses for the shipped .exe

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep line endings as they are in the repo
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, and history for the release notes

      - name: Check the version and that the tag is new
        run: |
          $v = $env:VERSION.Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$v' isn't in the form 1.2.3 (three numbers, no leading v)."
          }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $v) {
            throw "package.json says version $pkg but you asked to release $v. Bump `"version`" in package.json to $v (and commit it) first, so the app shows the right version."
          }
          git ls-remote --exit-code --tags origin "refs/tags/v$v" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "The tag v$v already exists, so v$v has already been released. Pick a new version number."
          }
          if ($LASTEXITCODE -ne 2) { throw "Couldn't check the tags on origin (git exit $LASTEXITCODE)." }
          $global:LASTEXITCODE = 0
          Write-Host "Releasing v$v from $env:GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Run tests (the release stops here if any fail)
        env:
          PYTHON: python
        run: npm test

      - name: Cache the Windows compiler (llvm-mingw)
        id: lm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Get the Windows compiler (llvm-mingw)
        if: steps.lm-cache.outputs.cache-hit != 'true'
        run: |
          $v = $env:LLVM_MINGW_VERSION
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Move-Item (Join-Path $env:RUNNER_TEMP "llvm-mingw-$v-ucrt-x86_64") (Join-Path $env:RUNNER_TEMP 'llvm-mingw')

      - name: Build the sound engine (stagehand-audio.exe, Release flags from native/build.sh)
        working-directory: native
        run: |
          $lm = Join-Path $env:RUNNER_TEMP 'llvm-mingw\bin'
          $dsp = 'dsp/sh_util.c','dsp/sh_amp.c','dsp/sh_cab.c','dsp/sh_fx.c','dsp/sh_rev.c','dsp/sh_engine.c','dsp/sh_nam.c'
          # replaces the committed prebuilt .exe in this runner's copy only, so the zip matches the tagged source
          & "$lm\x86_64-w64-mingw32-clang.exe" -O3 -ffp-contract=fast -fno-math-errno -Wall -Wno-unused-function `
            -march=x86-64-v2 -mtune=generic -static '-Wl,--subsystem,console' `
            -o bin/stagehand-audio.exe host/host.c host/io_wasapi.c @dsp -lole32 -luuid -lavrt -lksuser
          if ($LASTEXITCODE -ne 0) { throw "The sound engine didn't compile (exit $LASTEXITCODE)." }
          & "$lm\llvm-strip.exe" bin/stagehand-audio.exe
          if ($LASTEXITCODE -ne 0) { throw 'llvm-strip failed.' }
          Get-Item bin/stagehand-audio.exe | Format-List Name, Length

      - name: Hand the sound engine to the Setup job
        uses: actions/upload-artifact@v4
        with:
          name: audio-exe
          path: native/bin/stagehand-audio.exe
          if-no-files-found: error

  setup:
    # Stagehand-Setup-<version>.exe, then the tag and the release
    needs: release
    runs-on: ubuntu-latest
    env:
      DEPS: ${{ github.workspace }}/../deps
      SH_LLVM_MINGW: ${{ github.workspace }}/../llvm-mingw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The sound engine built and tested on Windows
        uses: actions/download-artifact@v4
        with:
          name: audio-exe
          path: native/bin

      - name: Get the compiler and the pinned downloads (to measure their SHA-256)
        run: bash scripts/session-setup.sh

      - name: Build Stagehand-Setup-${{ inputs.version }}.exe
        run: |
          SETUP_DEPS="$DEPS/electron.zip $DEPS/vgmstream.zip $DEPS/uv.zip" sh scripts/package.sh "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/Stagehand-Setup-$VERSION.exe"
          ls -la "$RUNNER_TEMP/out/Stagehand-Setup-$VERSION.exe"

      - name: Tag v${{ inputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Download Stagehand-Setup-$VERSION.exe below and run it.** It installs Stagehand, or updates the one you have.

          - The first install downloads what your PC doesn't have yet (the app runtime, about 150 MB, and the song audio decoder), so it takes a few minutes. Updates only copy Stagehand's own files: a few seconds.
          - If the connection drops, Setup tries again by itself; if you close it, run it again and it carries on where it stopped.
          - Windows may say it doesn't know the publisher: click **More info**, then **Run anyway**.
          - To remove Stagehand: Start menu › Uninstall Stagehand (tick the box to also delete your library data, for a fresh start).

          EOF
          gh release create "v$VERSION" "$RUNNER_TEMP/out/Stagehand-Setup-$VERSION.exe" --verify-tag --title "$APP_NAME v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
