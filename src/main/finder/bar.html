<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src 'self'">
<title>Find songs</title>
<style>
  @font-face { font-family: 'Archivo'; src: url('../../renderer/fonts/Archivo-Variable.ttf') format('truetype'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Typewriter Stagehand'; src: url('../../renderer/fonts/LiberationMono-Bold.ttf') format('truetype'); font-weight: 700; }
  :root { --gold: #f1ce68; --ink: #f5edda; --ink-2: #cfc4ad; --ink-3: #978b76; --good: #a6e35a; --warn: #ffb547; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Archivo', system-ui, sans-serif; color: var(--ink); user-select: none;
    background: linear-gradient(#24201a, #17140f); border-bottom: 2px solid #000;
    box-shadow: inset 0 -1px 0 #f1ce6826;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  button {
    font: inherit; color: var(--ink); background: #2c271f; border: 1px solid #4a4134; border-radius: 6px;
    height: 34px; padding: 0 12px; cursor: pointer; white-space: nowrap; font-weight: 700; font-size: 13px;
    box-shadow: 0 2px 0 #000; flex: none;
  }
  button:hover:not(:disabled) { background: #3a3328; border-color: #6a5c47; }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 #000; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.nav { width: 34px; padding: 0; font-size: 17px; }
  button.go { background: linear-gradient(#f6d77c, #e0b54c); color: #1a1408; border-color: #000; text-transform: uppercase; letter-spacing: .04em; font-stretch: 80%; font-weight: 900; }
  button.go:hover:not(:disabled) { background: linear-gradient(#ffe08c, #ebc05a); border-color: #000; }
  .tape {
    font-family: 'Typewriter Stagehand', monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    background: #e9dfc6; color: #2a2218; padding: 3px 8px; transform: rotate(-2deg); box-shadow: 1px 1px 0 #0007; flex: none;
  }
  /* a set width, so nothing moves when the words beside the Roadie change */
  .want { display: flex; flex-direction: column; justify-content: center; flex: none; width: clamp(110px, 17vw, 330px); min-width: 0; }
  .want b { font-weight: 900; font-stretch: 72%; font-size: 19px; line-height: 1.05; text-shadow: 2px 2px 0 #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .want span { font-family: 'Typewriter Stagehand', monospace; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp { display: flex; gap: 6px; flex: none; }
  /* 4.25: the Roadie (docs/roadie): a picture of what's going on; the words beside it say it exactly */
  .roadie {
    position: relative; flex: none; width: 240px; height: 57px; border-radius: 5px; overflow: hidden;
    background: #17120e; border: 1px solid #000; box-shadow: 0 0 0 1px #f1ce6822, 0 2px 0 #000;
  }
  .roadie img, .roadie video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .roadie video { opacity: 0; background: #17120e; }
  .roadie video.on { opacity: 1; }
  .say { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .msg { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .msg b { color: var(--ink); }
  .msg.good { color: var(--good); }
  .msg.warn { color: var(--warn); }
  .msg .pct { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
  .offer { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .offer[hidden] { display: none; }
  .offer button { height: 26px; font-size: 12px; padding: 0 10px; }
  .offer small { font-family: 'Typewriter Stagehand', monospace; font-size: 10.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.offering .msg { -webkit-line-clamp: 1; }
  .none .want, .none .tape, .none [data-act=find], .none [data-act=skip] { display: none; }
  /* narrower windows: the Roadie gets smaller, then the words step aside, then the Roadie, before any button */
  @media (max-width: 1400px) { .roadie { width: 210px; height: 50px; } .tape { display: none; } }
  @media (max-width: 1100px) { .msg { -webkit-line-clamp: 1; font-size: 12px; } }
  @media (max-width: 960px) { .roadie { display: none; } }
  @media (max-width: 860px) { .say { display: none; } [data-act=browser] { display: none; } }
</style>
<script src="roadie.js"></script>
</head>
<body class="none">
  <div class="grp">
    <button class="nav" data-act="back" title="Back" aria-label="Back">‹</button>
    <button class="nav" data-act="forward" title="Forward" aria-label="Forward">›</button>
    <button class="nav" data-act="reload" title="Reload" aria-label="Reload">⟳</button>
  </div>
  <span class="tape" id="tape">Looking for</span>
  <div class="want"><b id="song"></b><span id="left"></span></div>
  <div class="grp">
    <button class="go" data-act="find" title="Type this song into the site’s search box">Find</button>
    <button data-act="skip" title="Leave this one for later and look for the next wanted song">Next song</button>
  </div>
  <div class="roadie" id="roadie" role="img" aria-label="Ready"></div>
  <div class="say">
    <div class="msg" id="msg" aria-live="polite">Sign in to CustomsForge here once. Songs you download in this window go straight into your library.</div>
    <div class="offer" id="offer" hidden>
      <button data-act="openOffer" id="offerBtn" title="Open that link in your own browser">Open in my browser</button>
      <small id="offerHost"></small>
    </div>
  </div>
  <div class="grp zoom" role="group" aria-label="Page size">
    <button class="nav" data-act="zoomOut" title="Smaller: more of the site's table fits" aria-label="Smaller">−</button>
    <button data-act="zoomFit" title="Fit the site's table in this window (no scrolling sideways)" id="zoom">Fit</button>
    <button class="nav" data-act="zoomIn" title="Bigger" aria-label="Bigger">+</button>
  </div>
  <div class="grp">
    <button data-act="browser" title="Open this page in your own browser">My browser</button>
    <button data-act="close" title="Close the song finder">Done</button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const HELLO = 'Sign in to CustomsForge here once. Songs you download in this window go straight into your library.';
  const NAMES = { idle: 'Ready', searching: 'Searching', found: 'Song found', downloading: 'Downloading', importing: 'Importing', imported: 'In Songs', failed: 'Not this time' };
  for (const b of document.querySelectorAll('button[data-act]')) b.onclick = () => window.finderBar.act(b.dataset.act);
  let roadie = null;
  try {
    roadie = new window.RoadiePlayer($('roadie'));
    window.__roadie = roadie; // (tests: what it showed, and its frame count)
  } catch (_) {
    $('roadie').hidden = true;
  }
  window.finderBar.onState((st) => {
    document.body.classList.toggle('none', !st.want);
    if (st.want) {
      $('song').textContent = `${st.want.artist}${st.want.artist && st.want.title ? ' – ' : ''}${st.want.title}`;
      $('left').textContent = st.want.mode === 'update' ? 'a newer version of your song' : st.want.left > 1 ? `${st.want.left - 1} more wanted after this` : 'from your Wanted list';
      $('song').title = $('song').textContent;
      $('tape').textContent = st.want.mode === 'update' ? 'Updating' : 'Looking for';
    }
    if (roadie && st.view) roadie.set(st.view);
    // the words say exactly what's going on (the Roadie is only the picture of it)
    const downloads = st.downloads || [];
    const cur = downloads.find((d) => d.job === st.focus);
    const going = downloads.filter((d) => d.state === 'going');
    const m = $('msg');
    m.replaceChildren();
    if (st.done) {
      const b = document.createElement('b');
      b.textContent = st.done.title;
      m.append(b, st.done.text ? ` ${st.done.text}` : '');
      m.className = 'msg good';
    } else if (cur && cur.state === 'going') {
      m.append(`Downloading ${cur.name}`);
      if (cur.known) {
        const p = document.createElement('span');
        p.className = 'pct';
        p.textContent = ` ${cur.pct}%`;
        m.append(p);
      } else m.append('…');
      const others = going.length - 1;
      if (others > 0) m.append(` (and ${others} more)`);
      m.className = 'msg';
    } else {
      m.textContent = st.message || HELLO;
      m.className = `msg ${st.kind || ''}`;
    }
    m.title = m.textContent;
    const pct = cur && cur.state === 'going' && cur.known ? ` ${cur.pct}%` : '';
    $('roadie').setAttribute('aria-label', `${NAMES[(st.view && st.view.state) || 'idle'] || 'Ready'}${pct}`);
    // a link the player clicked to another site: one button to open it in their browser
    $('offer').hidden = !st.offer;
    document.body.classList.toggle('offering', !!st.offer);
    $('offerHost').textContent = st.offer ? st.offer.host : '';
    $('offerBtn').title = st.offer ? `Open ${st.offer.host} in your own browser` : '';
    $('zoom').textContent = st.zoom && Math.abs(st.zoom - 1) > 0.001 ? `Fit · ${Math.round(st.zoom * 100)}%` : 'Fit';
    document.querySelector('[data-act=back]').disabled = !st.canBack;
    document.querySelector('[data-act=forward]').disabled = !st.canForward;
  });
</script>
</body>
</html>
