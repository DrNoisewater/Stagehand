<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Find songs</title>
<style>
  @font-face { font-family: 'Archivo'; src: url('../../renderer/fonts/Archivo-Variable.ttf') format('truetype'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Typewriter Stagehand'; src: url('../../renderer/fonts/LiberationMono-Bold.ttf') format('truetype'); font-weight: 700; }
  :root { --gold: #f1ce68; --ink: #f5edda; --ink-2: #cfc4ad; --ink-3: #978b76; --good: #7fd18b; --warn: #ffb547; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Archivo', system-ui, sans-serif; color: var(--ink); user-select: none;
    background: linear-gradient(#24201a, #17140f); border-bottom: 2px solid #000;
    box-shadow: inset 0 -1px 0 #f1ce6826;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
  }
  button {
    font: inherit; color: var(--ink); background: #2c271f; border: 1px solid #4a4134; border-radius: 6px;
    height: 34px; padding: 0 12px; cursor: pointer; white-space: nowrap; font-weight: 700; font-size: 13px;
    box-shadow: 0 2px 0 #000;
  }
  button:hover:not(:disabled) { background: #3a3328; border-color: #6a5c47; }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 #000; }
  button:disabled { opacity: .35; cursor: default; }
  button.nav { width: 34px; padding: 0; font-size: 17px; }
  button.go { background: linear-gradient(#f6d77c, #e0b54c); color: #1a1408; border-color: #000; text-transform: uppercase; letter-spacing: .04em; font-stretch: 80%; font-weight: 900; }
  button.go:hover:not(:disabled) { background: linear-gradient(#ffe08c, #ebc05a); border-color: #000; }
  .tape {
    font-family: 'Typewriter Stagehand', monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    background: #e9dfc6; color: #2a2218; padding: 3px 8px; transform: rotate(-2deg); box-shadow: 1px 1px 0 #0007; flex: none;
  }
  .want { min-width: 0; display: flex; flex-direction: column; justify-content: center; flex: 0 0 auto; max-width: 30%; }
  .want b { font-weight: 900; font-stretch: 72%; font-size: 19px; line-height: 1.05; text-shadow: 2px 2px 0 #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .want span { font-family: 'Typewriter Stagehand', monospace; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .msg.good { color: var(--good); }
  .msg.warn { color: var(--warn); }
  .grp { display: flex; gap: 6px; flex: none; }
  .none .want, .none [data-act=find], .none [data-act=skip] { display: none; }
</style>
</head>
<body class="none">
  <div class="grp">
    <button class="nav" data-act="back" title="Back" aria-label="Back">‹</button>
    <button class="nav" data-act="forward" title="Forward" aria-label="Forward">›</button>
    <button class="nav" data-act="reload" title="Reload" aria-label="Reload">⟳</button>
  </div>
  <span class="tape">Looking for</span>
  <div class="want"><b id="song"></b><span id="left"></span></div>
  <div class="grp">
    <button class="go" data-act="find" title="Type this song into the site’s search box">Find</button>
    <button data-act="skip" title="Leave this one for later and look for the next wanted song">Next song</button>
  </div>
  <div class="msg" id="msg">Sign in to CustomsForge here once. Songs you download in this window go straight into your library.</div>
  <div class="grp">
    <button data-act="browser" title="Open this page in your own browser">My browser</button>
    <button data-act="close" title="Close the song finder">Done</button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const HELLO = 'Sign in to CustomsForge here once. Songs you download in this window go straight into your library.';
  for (const b of document.querySelectorAll('button[data-act]')) b.onclick = () => window.finderBar.act(b.dataset.act);
  window.finderBar.onState((st) => {
    document.body.classList.toggle('none', !st.want);
    if (st.want) {
      $('song').textContent = `${st.want.artist}${st.want.artist && st.want.title ? ' – ' : ''}${st.want.title}`;
      $('left').textContent = st.want.left > 1 ? `${st.want.left - 1} more wanted after this` : 'from your Wanted list';
    }
    const going = (st.downloads || []).filter((d) => d.state === 'going');
    const m = $('msg');
    m.textContent = going.length && !st.message.startsWith('Adding') ? `Downloading ${going.map((d) => `${d.name} ${d.pct}%`).join(', ')}` : st.message || HELLO;
    m.className = `msg ${going.length ? '' : st.kind || ''}`;
    document.querySelector('[data-act=back]').disabled = !st.canBack;
    document.querySelector('[data-act=forward]').disabled = !st.canForward;
  });
</script>
</body>
</html>
